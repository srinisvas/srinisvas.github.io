<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
  <link rel="canonical" href="{{ page.redirect_to | split: '#' | first | absolute_url }}">
</head>
<body><main><h1>{{ page.title }}</h1><p>This page has moved. <a href="{{ page.redirect_to | relative_url }}">Continue to {{ page.title | downcase }}</a>.</p></main></body>
</html>
