<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.canonical_path | default: page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Baskerville:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-nav">
    <nav class="nav-inner shell" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" class="nav-name" {% if page.nav == 'home' %}aria-current="page"{% endif %}>{{ site.title }}</a>
      <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="navigation-links">Menu</button>
      <ul class="nav-links" id="navigation-links">
        <li><a href="{{ '/engineering.html' | relative_url }}" {% if page.nav == 'engineering' %}aria-current="page"{% endif %}>Engineering</a></li>
        <li><a href="{{ '/research.html' | relative_url }}" {% if page.nav == 'research' %}aria-current="page"{% endif %}>Research</a></li>
        <li><a href="{{ '/about.html' | relative_url }}" {% if page.nav == 'about' %}aria-current="page"{% endif %}>About</a></li>
        <li><a href="{{ '/resume.html' | relative_url }}" {% if page.nav == 'resume' %}aria-current="page"{% endif %}>Résumé</a></li>
      </ul>
    </nav>
  </header>
  <main class="shell" id="main-content">{{ content }}</main>
  <footer class="site-footer shell">
    <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</p>
    <div class="footer-links"><a href="mailto:{{ site.email }}">Email</a><a href="{{ site.linkedin_url }}">LinkedIn</a><a href="{{ site.github_url }}">GitHub</a><a href="{{ '/resume.html' | relative_url }}">Résumé</a></div>
  </footer>
</body>
</html>
